# Headless GDScript suites. The only download is the official Godot 4.7.2
# editor binary; the suites need no export templates, no secrets and no other
# network access. `tests/test_env.gd` is a helper, not a suite (see the loop).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_BIN: Godot_v4.7.2-stable_linux.x86_64
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip

jobs:
  suites:
    name: GDScript suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore Godot ${{ env.GODOT_VERSION }}
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/$ZIP" "$GODOT_URL"
          unzip -q "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/$GODOT_BIN"

      - name: Put godot on PATH
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$RUNNER_TEMP/godot/$GODOT_BIN" "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/godot" --version

      # A fresh checkout has no `.godot/` cache, and no suite can load an
      # imported resource (WAV, glTF, PNG) before it exists, so one import pass
      # is required. It is not an export and needs no templates.
      - name: Import assets
        run: godot --headless --path . --import

      - name: Run every suite
        shell: bash
        run: |
          set -uo pipefail

          suites=()
          for path in tests/test_*.gd; do
            name="${path##*/}"
            name="${name%.gd}"
            # test_env.gd extends RefCounted and only holds the isolation
            # helpers; run on its own it exits 1 by design.
            if [ "$name" = "test_env" ]; then
              echo "skip   $name.gd (helper, not a suite)"
              continue
            fi
            suites+=("$name")
          done

          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::no tests/test_*.gd suite found"
            exit 1
          fi

          total=0
          failed=0
          printf '%-22s %6s %6s %6s\n' "suite" "pass" "fail" "exit"
          for suite in "${suites[@]}"; do
            log="$(mktemp)"
            # Headless runs keep audio output disabled on purpose: a player
            # still sounding at exit is reported as a leaked resource.
            status=0
            godot --headless --path . --script "res://tests/$suite.gd" >"$log" 2>&1 || status=$?
            pass="$(grep -c '^PASS ' "$log" || true)"
            fails="$(grep -c '^FAIL' "$log" || true)"
            pass="${pass:-0}"
            fails="${fails:-0}"
            total=$((total + pass))
            printf '%-22s %6d %6d %6d\n' "$suite" "$pass" "$fails" "$status"

            # Belt and braces: the exit code is the contract, but a suite that
            # prints FAIL and forgets to quit(1) must not slip through, and one
            # that asserts nothing has not run.
            if [ "$status" -ne 0 ] || [ "$fails" -ne 0 ] || [ "$pass" -eq 0 ]; then
              failed=$((failed + 1))
              echo "::error title=$suite failed::exit=$status fail_lines=$fails pass_lines=$pass"
              echo "----- $suite output -----"
              cat "$log"
              echo "----- end $suite -----"
            fi
            rm -f "$log"
          done

          echo
          echo "suites=${#suites[@]} pass=$total failed_suites=$failed"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed suite(s) failed"
            exit 1
          fi
